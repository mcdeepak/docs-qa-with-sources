# One command starts everything:  docker compose up --build
# Then open http://localhost:8000  (login: admin / admin)
# Settings are read from .env if present. See .env.example.

x-app: &app
  build: .
  environment:
    DATABASE_URL: postgresql://docsqa:docsqa@db:5432/docsqa
    APP_USERNAME: ${APP_USERNAME:-admin}
    APP_PASSWORD: ${APP_PASSWORD:-admin}
    SECRET_KEY: ${SECRET_KEY:-local-development-only}
    RETRIEVER: ${RETRIEVER:-bm25}
    ANSWERER: ${ANSWERER:-extractive}
    SUPPORT_THRESHOLD: ${SUPPORT_THRESHOLD:-0.55}
    ABSENT_TERM_WEIGHT: ${ABSENT_TERM_WEIGHT:-2.0}
    USE_SYNONYMS: ${USE_SYNONYMS:-true}
    WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-20}
    INDEX_DELAY_SECONDS: ${INDEX_DELAY_SECONDS:-0}
    LLM_BASE_URL: ${LLM_BASE_URL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-}
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: docsqa
      POSTGRES_PASSWORD: docsqa
      POSTGRES_DB: docsqa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsqa -d docsqa"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    ports:
      - "${APP_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]

volumes:
  pgdata:
