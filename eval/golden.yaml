# Golden question set for the 20-document corpus (samples/ + eval/corpus/).
#
# split: dev  -> used to choose the threshold and synonyms.
# split: test -> held out. Never used for tuning; this is the number to trust.
#
# Answerable questions name the file and a phrase that the cited passage must contain.
# A list of phrases means any one of them is acceptable (the question has two valid answers).
# Unanswerable questions have `answerable: false`; the right behaviour is to decline.

